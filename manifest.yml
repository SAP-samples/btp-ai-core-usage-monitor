---
applications:
  - name: ai-core-monitor
    memory: 256M
    disk_quota: 512M
    instances: 1
    random-route: true
    buildpacks:
      - python_buildpack
    command: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT server:app
    health-check-type: http
    health-check-http-endpoint: /health
    env:
      # ── BTP Subaccount ──────────────────────────────────────────────────────
      SUBACCOUNT_ID: "your-subaccount-uuid" # The UUID of the subaccount to monitor (from BTP cockpit URL)

      # ── Spending limit & thresholds ─────────────────────────────────────────
      SPENDING_LIMIT: "100" # Monthly AI Core capacity unit budget
      WARNING_THRESHOLD_PERCENT: "60" # Send a WARNING email when usage reaches this % of the limit
      ALERT_THRESHOLD_PERCENT: "80" # Send an ALERT email when usage reaches this % of the limit

      # ── Notifications ───────────────────────────────────────────────────────
      RECEIVE_DAILY_UPDATE_EMAILS: "true" # Send a daily summary email even when below warning threshold
      NOTIFICATION_EMAIL: "example@example.com" # Comma-separated list of recipient email addresses
      SENDER_NAME: "AI Core Consumption Monitor" # Display name shown in the From field of notification emails

      # ── Schedule (UTC) ──────────────────────────────────────────────────────
      CHECK_TIME_UTC: "07:00" # Time of day (UTC) to run the daily check  (HH:MM format)

      # ── UAS Reporting API credentials ───────────────────────────────────────
      # Option A (recommended): bind the 'uas' service instance below in `services:`
      #   → credentials are read automatically from VCAP_SERVICES, no env vars needed.
      #   UAS_SERVICE_NAME is optional – only needed if multiple 'uas' instances are bound.
      # UAS_SERVICE_NAME: "uas-reporting"
      #
      # Option B: provide credentials explicitly (set secret via cf set-env)
      #   cf set-env ai-core-monitor UAS_CLIENT_SECRET '...'
      # UAS_CLIENT_ID: "sb-..."
      # UAS_TOKEN_URL: "https://<global-account-id>.authentication.<region>.hana.ondemand.com/oauth/token"
      # UAS_REPORTING_BASE_URL is optional – derived automatically from UAS_TOKEN_URL
      # UAS_REPORTING_BASE_URL: "https://uas-reporting.cfapps.<region>.hana.ondemand.com"
      UAS_CLIENT_ID: "your-uas-client-id"
      UAS_TOKEN_URL: "https://<global-account-id>.authentication.<region>.hana.ondemand.com/oauth/token"

      # ── SMTP email ──────────────────────────────────────────────────────────
      # Set SMTP_PASSWORD via: cf set-env ai-core-monitor SMTP_PASSWORD "..."
      ENABLE_SMTP: "true"
      SMTP_HOST: "smtp.example.com"
      SMTP_PORT: "587"
      SMTP_USER: "monitor@example.com"
      # SMTP_FROM: "monitor@example.com"  # Sender address; defaults to SMTP_USER
      SMTP_USE_TLS: "true"

      # ── SAP Alert Notification Service ──────────────────────────────────────
      # Set ENABLE_ANS=true and bind the alert-notification service instance,
      # OR provide ANS_URL / ANS_CLIENT_ID / ANS_CLIENT_SECRET / ANS_TOKEN_URL.
      # ANS_SERVICE_NAME is only needed if multiple ANS instances are bound.
      ENABLE_ANS: "false"
      # ANS_SERVICE_NAME: "ai-core-monitor-ans"

    # Bind CF service instances here.
    # Option A for UAS: add your 'uas' service instance name to avoid managing credentials manually.
    # services:
    #   - ai-core-monitor-ans
    #   - uas-reporting   # uncomment to use CF service binding for UAS credentials

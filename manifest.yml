---
applications:
  - name: ai-core-monitor
    memory: 256M
    disk_quota: 512M
    instances: 1
    buildpacks:
      - python_buildpack
    command: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT server:app
    health-check-type: http
    health-check-http-endpoint: /health
    env:
      # ── BTP Subaccount ──────────────────────────────────────────────────────
      SUBACCOUNT_ID: "your-subaccount-uuid"

      # ── Spending limit & thresholds ─────────────────────────────────────────
      SPENDING_LIMIT: "100"
      WARNING_THRESHOLD_PERCENT: "60"
      ALERT_THRESHOLD_PERCENT: "80"

      # ── Notifications ───────────────────────────────────────────────────────
      RECEIVE_DAILY_UPDATE_EMAILS: "true"
      NOTIFICATION_EMAIL: "example@example.com"
      SENDER_NAME: "AI Core Monitor"

      # ── Schedule (UTC) ──────────────────────────────────────────────────────
      CHECK_TIME_UTC: "07:00"

      # ── UAS Reporting API credentials ───────────────────────────────────────
      # Obtain from the Usage Data Management service key in BTP cockpit
      # Set UAS_CLIENT_SECRET via: cf set-env ai-core-monitor UAS_CLIENT_SECRET "..."
      #
      # UAS_REPORTING_BASE_URL is optional – it is derived automatically from
      # UAS_TOKEN_URL (region is extracted from the token URL hostname).
      # Set it explicitly only if auto-detection does not work:
      # UAS_REPORTING_BASE_URL: "https://uas-reporting.cfapps.<region>.hana.ondemand.com"
      UAS_CLIENT_ID: "your-uas-client-id"
      UAS_TOKEN_URL: "https://<global-account-id>.authentication.<region>.hana.ondemand.com"

      # ── SMTP email ──────────────────────────────────────────────────────────
      # Set SMTP_PASSWORD via: cf set-env ai-core-monitor SMTP_PASSWORD "..."
      ENABLE_SMTP: "true"
      SMTP_HOST: "smtp.example.com"
      SMTP_PORT: "587"
      SMTP_USER: "monitor@example.com"
      # SMTP_FROM: "monitor@example.com"  # Sender address; defaults to SMTP_USER
      SMTP_USE_TLS: "true"

      # ── SAP Alert Notification Service ──────────────────────────────────────
      # Set ENABLE_ANS=true and bind the alert-notification service instance,
      # OR provide ANS_URL / ANS_CLIENT_ID / ANS_CLIENT_SECRET / ANS_TOKEN_URL
      ENABLE_ANS: "false"
      ANS_SERVICE_NAME: "ai-core-monitor-ans"

    # Bind the SAP Alert Notification Service instance here (optional)
    # services:
    #   - ai-core-monitor-ans